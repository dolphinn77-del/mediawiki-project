---
- name: Change Zabbix Admin password
  hosts: monitoring
  gather_facts: false

  vars:
    zabbix_api_url: "http://127.0.0.1/api_jsonrpc.php"

  tasks:
    - name: Login with default Admin password
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        return_content: true
        headers:
          Content-Type: application/json-rpc
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: Admin
            password: zabbix
            userData: true
          id: 1
      register: zabbix_login
      no_log: true

    - name: Change Admin password
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        return_content: true
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_login.json.result.sessionid }}"
        body:
          jsonrpc: "2.0"
          method: user.update
          params:
            userid: "{{ zabbix_login.json.result.userid }}"
            current_passwd: "zabbix"
            passwd: "{{ zabbix_admin_password }}"
          id: 2
      register: zabbix_update
      no_log: true

    - name: Fail if password change was rejected
      ansible.builtin.fail:
        msg: "{{ zabbix_update.json.error }}"
      when: zabbix_update.json.error is defined

    - name: Verify new Admin password
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        return_content: true
        headers:
          Content-Type: application/json-rpc
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: Admin
            password: "{{ zabbix_admin_password }}"
          id: 3
      register: zabbix_verify
      no_log: true

    - name: Confirm password change
      ansible.builtin.assert:
        that:
          - zabbix_verify.json.result is defined
        success_msg: "Zabbix Admin password changed and verified"
        fail_msg: "New Zabbix Admin password verification failed"
