---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Configure MediaWiki load balancer
  ansible.builtin.template:
    src: mediawiki-lb.conf.j2
    dest: /etc/nginx/sites-available/mediawiki-lb
    mode: "0644"
  notify: Reload Nginx

- name: Enable MediaWiki load balancer site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/mediawiki-lb
    dest: /etc/nginx/sites-enabled/mediawiki-lb
    state: link
  notify: Reload Nginx

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
